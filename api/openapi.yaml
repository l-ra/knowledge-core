openapi: 3.0.3
info:
  title: Knowledge Core API
  version: 0.2.2
  description: |
    Knowledge graph core (Wikibase-inspired). All `/v1/*` endpoints require authentication.

    Integration guide: docs/integration/README.md
    Request/response patterns and value types: docs/integration/api-contract.md
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
  /v1/ui/config:
    get:
      summary: Public UI/OIDC bootstrap config
      security: []
      tags: [ui]
      responses:
        "200":
          description: OK
  /v1/me:
    get:
      summary: Current authenticated principal
      tags: [auth]
      responses:
        "200":
          description: OK
  /v1/admin/auth:
    get:
      summary: OIDC/IdP link status and setup instructions (admin)
      tags: [auth]
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
    put:
      summary: Persist OIDC settings from IdP (admin); hot-swaps authenticator
      tags: [auth]
      responses:
        "200":
          description: OK
        "400":
          description: Invalid issuer or payload
  /v1/entities:
    get:
      summary: List entities (cursor pagination, ACL discover)
      tags: [graph]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: cursor
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, enum: [entity, property, class] }
        - name: package
          in: query
          schema: { type: string }
        - name: iriLocal
          in: query
          description: Match entity.iri_local (unique per package when package is set)
          schema: { type: string }
        - name: iri
          in: query
          description: Canonical IRI (iriBase+iriLocal) or entity_iri_alias
          schema: { type: string }
        - name: instanceOf
          in: query
          description: Class IRI
          schema: { type: string }
        - name: includeSubclasses
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityList"
    post:
      summary: Create entity
      tags: [graph]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntity"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponseEntity"
  /v1/entities/{qid}:
    get:
      summary: Get entity (includes effectiveClasses)
      tags: [graph]
      parameters:
        - $ref: "#/components/parameters/qid"
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update entity
      tags: [graph]
      parameters:
        - $ref: "#/components/parameters/qid"
      responses:
        "200":
          description: OK
  /v1/entities/{qid}/statements:
    get:
      summary: List outgoing statements
      tags: [graph]
      parameters:
        - $ref: "#/components/parameters/qid"
        - name: property
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
  /v1/entities/{qid}/incoming:
    get:
      summary: List incoming statements (value_entity = this entity)
      tags: [graph]
      parameters:
        - $ref: "#/components/parameters/qid"
        - name: property
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
  /v1/entities/{qid}/graph:
    get:
      summary: Neighborhood (outgoing, incoming, neighbor entities)
      tags: [graph]
      parameters:
        - $ref: "#/components/parameters/qid"
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 2, default: 1 }
      responses:
        "200":
          description: OK
  /v1/entities/{qid}/move:
    post:
      summary: Move entity (and same-package subject statements) to another package
      tags: [graph]
      parameters:
        - $ref: "#/components/parameters/qid"
      responses:
        "200":
          description: OK
        "409":
          description: iriLocal conflict in target package
  /v1/entities/{qid}/history:
    get:
      summary: Entity revision history
      tags: [graph]
      parameters:
        - $ref: "#/components/parameters/qid"
      responses:
        "200":
          description: OK
  /v1/entities/{qid}/deprecate:
    post:
      summary: Deprecate entity (status active → deprecated)
      tags: [graph]
      parameters:
        - $ref: "#/components/parameters/qid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpectedRevision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponseEntity"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not active, or revision conflict
  /v1/entities/{qid}/delete:
    post:
      summary: Logically delete entity (status → deleted)
      description: |
        History is preserved. Outgoing active statements are deprecated.
        Fails with 409 if other active statements still reference the entity
        as property, value, or qualifier.
      tags: [graph]
      parameters:
        - $ref: "#/components/parameters/qid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpectedRevision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponseEntity"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Incoming references remain, or revision conflict

  /v1/properties:
    get:
      summary: List properties (cursor pagination)
      tags: [graph]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
    post:
      summary: Create property
      tags: [graph]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProperty"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponseProperty"
  /v1/properties/{pid}:
    get:
      summary: Get property (includes iriLocal, iri, packageCode)
      tags: [graph]
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
    patch:
      summary: Update property constraints
      tags: [graph]
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
  /v1/statements:
    post:
      summary: Create statement (upsert=true returns existing duplicate as 200)
      tags: [graph]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStatement"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponseStatement"
        "200":
          description: Existing statement returned (upsert)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponseStatement"

  /v1/statements/{sid}:
    get:
      summary: Get statement
      tags: [graph]
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/statements/{sid}/revise:
    post:
      summary: Revise statement
      tags: [graph]
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/statements/{sid}/deprecate:
    post:
      summary: Deprecate statement (status active → deprecated)
      tags: [graph]
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpectedRevision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponseStatement"
        "409":
          description: Not active, or revision conflict

  /v1/statements/{sid}/history:
    get:
      summary: Statement revision history
      tags: [graph]
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/references:
    post:
      summary: Create reference
      tags: [provenance]
      responses:
        "201":
          description: Created
  /v1/references/{rid}:
    get:
      summary: Get reference
      tags: [provenance]
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/changesets:
    get:
      summary: List change sets
      tags: [history]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Search public id, actor, operation type, comment, correlation id, idempotency key
          schema: { type: string }
        - name: actor
          in: query
          schema: { type: string }
        - name: operationType
          in: query
          schema: { type: string }
        - name: correlationId
          in: query
          schema: { type: string }
        - name: objectId
          in: query
          description: Filter by touched object public id (entity/statement/…)
          schema: { type: string }
        - name: committedFrom
          in: query
          description: RFC3339 / RFC3339Nano lower bound (inclusive)
          schema: { type: string, format: date-time }
        - name: committedTo
          in: query
          description: RFC3339 / RFC3339Nano upper bound (inclusive)
          schema: { type: string, format: date-time }
        - name: status
          in: query
          description: "open | committed | cancelled | all (default committed)"
          schema: { type: string }
      responses:
        "200":
          description: OK
    post:
      summary: Apply change set batch (immediate committed)
      tags: [history]
      responses:
        "200":
          description: OK
  /v1/changesets/open:
    post:
      summary: Open a progressive ChangeSet (writes go to overlay until commit)
      tags: [history]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
                operationType: { type: string }
      responses:
        "201":
          description: Created open ChangeSet
  /v1/changesets/{cid}:
    get:
      summary: Get change set
      tags: [history]
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/changesets/{cid}/commit:
    post:
      summary: Commit open ChangeSet into committed history
      tags: [history]
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Committed
        "409":
          description: Optimistic lock / IRI conflict (ChangeSet stays open)
  /v1/changesets/{cid}/cancel:
    post:
      summary: Cancel open ChangeSet and drop overlay
      tags: [history]
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
  /v1/packages:
    get:
      summary: List packages
      tags: [packages]
      responses:
        "200":
          description: OK
    post:
      summary: Create package
      tags: [packages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePackage"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponsePackage"
  /v1/packages/{code}:
    get:
      summary: Get package (dependencies as dependsOnCode / versionRange)
      tags: [packages]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    patch:
      summary: Update package
      tags: [packages]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    delete:
      summary: Delete package and owned graph data
      tags: [packages]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
  /v1/packages/{code}/releases:
    post:
      summary: Publish release
      tags: [packages]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Created
  /v1/packages/{code}/releases/{version}:
    get:
      summary: Get release
      tags: [packages]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/packages/{code}/releases/{version}/bundle:
    get:
      summary: Export release bundle
      tags: [packages]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/releases/import:
    post:
      summary: Import release bundle
      tags: [packages]
      responses:
        "201":
          description: Imported
  /v1/policies:
    get:
      summary: List auth policies
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      $ref: "#/components/schemas/Policy"
    post:
      summary: Create or update auth policy
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPolicy"
      responses:
        "200":
          description: OK
  /v1/policies/{name}:
    get:
      summary: Get auth policy
      tags: [auth]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    put:
      summary: Update auth policy
      tags: [auth]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPolicy"
      responses:
        "200":
          description: OK
    delete:
      summary: Delete auth policy
      tags: [auth]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/classes:
    get:
      summary: List classes
      tags: [schema]
      responses:
        "200":
          description: OK
    post:
      summary: Create class
      tags: [schema]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClass"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponseClass"
  /v1/classes/{cid}:
    get:
      summary: Get class (iriLocal, iri, effectiveClasses)
      tags: [schema]
      parameters:
        - name: cid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
  /v1/shapes:
    get:
      summary: List shapes
      tags: [schema]
      parameters:
        - name: package
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
    post:
      summary: Create shape (optional packageCode; defaults to class package)
      tags: [schema]
      responses:
        "201":
          description: Created
  /v1/shapes/{code}:
    get:
      summary: Get shape
      tags: [schema]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
  /v1/admin/schema-config:
    get:
      summary: Schema config (instanceOfProperty)
      tags: [schema]
      responses:
        "200":
          description: OK
    put:
      summary: Update schema config
      tags: [schema]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaConfig"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaConfig"
  /v1/lenses:
    get:
      summary: List lenses
      tags: [lenses]
      responses:
        "200":
          description: OK
    post:
      summary: Register lens
      tags: [lenses]
      responses:
        "201":
          description: Created
  /v1/lenses/{code}:
    get:
      summary: Get lens
      tags: [lenses]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/lenses/{code}/instances/{key}:
    get:
      summary: Read lens instance
      tags: [lenses]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/lenses/{code}/instances/{key}/patch:
    post:
      summary: Patch lens instance
      tags: [lenses]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/graphql:
    post:
      summary: GraphQL adapter
      tags: [lenses]
      responses:
        "200":
          description: OK
  /v1/projections/outbox/process:
    post:
      summary: Process pending outbox events
      tags: [projections]
      responses:
        "200":
          description: OK
  /v1/projections/search:
    get:
      summary: Search projection (ACL-aware)
      tags: [projections]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/projections/search/rebuild:
    post:
      summary: Rebuild search projection
      tags: [projections]
      responses:
        "200":
          description: OK
  /v1/projections/rdf:
    get:
      summary: Export RDF N-Triples
      tags: [projections]
      responses:
        "200":
          description: N-Triples
          content:
            application/n-triples:
              schema:
                type: string
  /v1/projections/rdf/rebuild:
    post:
      summary: Rebuild RDF projection
      tags: [projections]
      responses:
        "200":
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bootstrap password or OIDC JWT
    devHeaders:
      type: apiKey
      in: header
      name: X-Subject
      description: Dev auth subject (with X-Roles)
  parameters:
    qid:
      name: qid
      in: path
      required: true
      schema:
        type: string
    KnowledgeChangeset:
      name: X-Knowledge-Changeset
      in: header
      required: false
      description: Target open ChangeSet for progressive writes
      schema: { type: string }
    KnowledgeChangesets:
      name: X-Knowledge-Changesets
      in: header
      required: false
      description: Comma-separated open ChangeSet ids for read-merge
      schema: { type: string }
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    LocalizedLabels:
      type: object
      required: [en]
      properties:
        en:
          type: string
      additionalProperties:
        type: string
    Value:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            - EntityReference
            - String
            - LocalizedString
            - Boolean
            - Integer
            - Decimal
            - Date
            - DateTime
            - URI
            - ExternalIdentifier
            - Quantity
            - Interval
        entityId:
          type: string
          description: EntityReference — canonical IRI
        string:
          type: string
        langMap:
          type: object
          additionalProperties:
            type: string
        bool:
          type: boolean
        int64:
          type: integer
          format: int64
        decimal:
          type: string
        date:
          type: string
          format: date
        dateTime:
          type: string
          format: date-time
        uri:
          type: string
          format: uri
        scheme:
          type: string
        value:
          type: string
        quantityValue:
          type: string
        unitEntityId:
          type: string
        from:
          type: object
        to:
          type: object
    Qualifier:
      type: object
      required: [property, value]
      properties:
        property:
          type: string
        value:
          $ref: "#/components/schemas/Value"
    PackageDependency:
      type: object
      required: [dependsOnCode, versionRange]
      properties:
        dependsOnCode:
          type: string
        versionRange:
          type: string
    PropertyConstraints:
      type: object
      properties:
        domainClasses:
          type: array
          items:
            type: string
        rangeClasses:
          type: array
          items:
            type: string
        minCount:
          type: integer
        maxCount:
          type: integer
        severity:
          type: string
    ChangeSet:
      type: object
      properties:
        id:
          type: string
        canonicalId:
          type: string
          format: uuid
        actor:
          type: string
        operationType:
          type: string
        committedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            properties:
              objectType:
                type: string
              objectId:
                type: string
                format: uuid
              publicId:
                type: string
              op:
                type: string
    CreateEntity:
      type: object
      required: [labels]
      properties:
        packageCode:
          type: string
        labels:
          $ref: "#/components/schemas/LocalizedLabels"
        descriptions:
          type: object
          additionalProperties:
            type: string
        iriLocal:
          type: string
          description: Optional meaningful local identifier. If omitted, the server generates a stable fallback local ID.
    Entity:
      type: object
      properties:
        id:
          type: string
          description: Canonical IRI
        displayId:
          type: string
          description: Short UI alias such as packageCode:iriLocal
        canonicalId:
          type: string
          format: uuid
        status:
          type: string
        kind:
          type: string
          enum: [entity, property, class]
        revisionNo:
          type: integer
        labels:
          $ref: "#/components/schemas/LocalizedLabels"
        descriptions:
          type: object
          additionalProperties:
            type: string
        packageCode:
          type: string
        iriLocal:
          type: string
          description: Package-local identifier used to compose the canonical IRI.
        iri:
          type: string
        iriAliases:
          type: array
