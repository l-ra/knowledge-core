openapi: 3.0.3
info:
  title: Knowledge Core API
  version: 0.1.0
  description: |
    Knowledge graph core (Wikibase-inspired). All `/v1/*` endpoints require authentication.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
  /v1/entities:
    post:
      summary: Create entity
      tags: [graph]
      responses:
        "201":
          description: Created
  /v1/entities/{qid}:
    get:
      summary: Get entity
      tags: [graph]
      parameters:
        - $ref: "#/components/parameters/qid"
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update entity
      tags: [graph]
      parameters:
        - $ref: "#/components/parameters/qid"
      responses:
        "200":
          description: OK
  /v1/entities/{qid}/statements:
    get:
      summary: List entity statements
      tags: [graph]
      parameters:
        - $ref: "#/components/parameters/qid"
      responses:
        "200":
          description: OK
  /v1/entities/{qid}/history:
    get:
      summary: Entity revision history
      tags: [graph]
      parameters:
        - $ref: "#/components/parameters/qid"
      responses:
        "200":
          description: OK
  /v1/properties:
    post:
      summary: Create property
      tags: [graph]
      responses:
        "201":
          description: Created
  /v1/properties/{pid}:
    get:
      summary: Get property
      tags: [graph]
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/statements:
    post:
      summary: Create statement
      tags: [graph]
      responses:
        "201":
          description: Created
  /v1/statements/{sid}:
    get:
      summary: Get statement
      tags: [graph]
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/statements/{sid}/revise:
    post:
      summary: Revise statement
      tags: [graph]
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/statements/{sid}/history:
    get:
      summary: Statement revision history
      tags: [graph]
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/references:
    post:
      summary: Create reference
      tags: [provenance]
      responses:
        "201":
          description: Created
  /v1/references/{rid}:
    get:
      summary: Get reference
      tags: [provenance]
      parameters:
        - name: rid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/changesets:
    post:
      summary: Apply change set batch
      tags: [history]
      responses:
        "200":
          description: OK
  /v1/changesets/{cid}:
    get:
      summary: Get change set
      tags: [history]
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/packages:
    post:
      summary: Create package
      tags: [packages]
      responses:
        "201":
          description: Created
  /v1/packages/{code}:
    get:
      summary: Get package
      tags: [packages]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/packages/{code}/releases:
    post:
      summary: Publish release
      tags: [packages]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Created
  /v1/packages/{code}/releases/{version}:
    get:
      summary: Get release
      tags: [packages]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/packages/{code}/releases/{version}/bundle:
    get:
      summary: Export release bundle
      tags: [packages]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/releases/import:
    post:
      summary: Import release bundle
      tags: [packages]
      responses:
        "201":
          description: Imported
  /v1/policies:
    get:
      summary: List auth policies
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      $ref: "#/components/schemas/Policy"
    post:
      summary: Create or update auth policy
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPolicy"
      responses:
        "200":
          description: OK
  /v1/policies/{name}:
    get:
      summary: Get auth policy
      tags: [auth]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    put:
      summary: Update auth policy
      tags: [auth]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPolicy"
      responses:
        "200":
          description: OK
    delete:
      summary: Delete auth policy
      tags: [auth]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/lenses:
    post:
      summary: Register lens
      tags: [lenses]
      responses:
        "201":
          description: Created
  /v1/lenses/{code}:
    get:
      summary: Get lens
      tags: [lenses]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/lenses/{code}/instances/{key}:
    get:
      summary: Read lens instance
      tags: [lenses]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/lenses/{code}/instances/{key}/patch:
    post:
      summary: Patch lens instance
      tags: [lenses]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/graphql:
    post:
      summary: GraphQL adapter
      tags: [lenses]
      responses:
        "200":
          description: OK
  /v1/projections/outbox/process:
    post:
      summary: Process pending outbox events
      tags: [projections]
      responses:
        "200":
          description: OK
  /v1/projections/search:
    get:
      summary: Search projection (ACL-aware)
      tags: [projections]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/projections/search/rebuild:
    post:
      summary: Rebuild search projection
      tags: [projections]
      responses:
        "200":
          description: OK
  /v1/projections/rdf:
    get:
      summary: Export RDF N-Triples
      tags: [projections]
      responses:
        "200":
          description: N-Triples
          content:
            application/n-triples:
              schema:
                type: string
  /v1/projections/rdf/rebuild:
    post:
      summary: Rebuild RDF projection
      tags: [projections]
      responses:
        "200":
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bootstrap password or OIDC JWT
    devHeaders:
      type: apiKey
      in: header
      name: X-Subject
      description: Dev auth subject (with X-Roles)
  parameters:
    qid:
      name: qid
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    Policy:
      type: object
      properties:
        name:
          type: string
        priority:
          type: integer
        document:
          $ref: "#/components/schemas/PolicyDocument"
    UpsertPolicy:
      type: object
      required: [document]
      properties:
        name:
          type: string
        priority:
          type: integer
        document:
          $ref: "#/components/schemas/PolicyDocument"
    PolicyDocument:
      type: object
      required: [effect, operations]
      properties:
        effect:
          type: string
          enum: [allow, deny]
        operations:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        subjects:
          type: array
          items:
            type: string
        resource:
          type: object
          properties:
            type:
              type: string
            publicId:
              type: string
        properties:
          type: array
          items:
            type: string

security:
  - bearerAuth: []
