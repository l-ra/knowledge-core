#:schema https://json.schemastore.org/any.json

# Go live-reload for local development (Air).
# UI changes are handled by Vite HMR — do not watch web/ui assets here.

root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
cmd = "go build -o ./tmp/knowledge-core ./cmd/knowledge-core"
bin = "./tmp/knowledge-core"
entrypoint = ["./tmp/knowledge-core"]
include_ext = ["go", "sql"]
include_dir = ["cmd", "internal", "migrations"]
include_file = ["web/ui/embed.go"]
exclude_dir = [
  "tmp",
  "bin",
  "docs",
  "deploy",
  "models",
  "web/ui/node_modules",
  "web/ui/dist",
  "web/ui/src",
  ".git",
  ".github",
  "scripts",
]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
follow_symlink = false
log = "air.log"
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = false
main_only = false
silent = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true

[proxy]
enabled = false
