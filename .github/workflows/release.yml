name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: l-ra/knowledge-core
  CHART_PATH: deploy/helm/knowledge-core

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set chart version
        run: ./deploy/helm/scripts/set-chart-version.sh "${{ steps.ver.outputs.version }}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        env:
          KC_DATABASE_URL: postgres://kc:kc@localhost:5433/knowledge_core?sslmode=disable
        run: |
          docker run -d --name pg -e POSTGRES_USER=kc -e POSTGRES_PASSWORD=kc -e POSTGRES_DB=knowledge_core -p 5433:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U kc -d knowledge_core && break
            sleep 1
          done
          go test ./... -count=1

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Package and push Helm chart
        id: chart
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          helm package "${{ env.CHART_PATH }}" --destination /tmp/chart
          CHART_ARCHIVE="/tmp/chart/knowledge-core-${VERSION}.tgz"
          echo "archive=${CHART_ARCHIVE}" >> "$GITHUB_OUTPUT"
          helm push "${CHART_ARCHIVE}" oci://${{ env.REGISTRY }}/l-ra

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.chart.outputs.archive }}
          generate_release_notes: true

      - name: Sync Chart.yaml on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          ./deploy/helm/scripts/set-chart-version.sh "${{ steps.ver.outputs.version }}"
          git add "${{ env.CHART_PATH }}/Chart.yaml"
          if git diff --staged --quiet; then
            echo "Chart.yaml already at ${{ steps.ver.outputs.version }} on main"
          else
            git commit -m "chore(helm): set chart version to ${{ steps.ver.outputs.version }} [skip ci]"
            git push origin main
          fi
