# Project name avoids "deploy_default" when run from this directory.
# Explicit subnet: default Podman pools (10.89+) collide with hosts that
# advertise a 10.0.0.0/8 route (common on corporate Wi‑Fi / VPN).
name: knowledge-core

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: kc
      POSTGRES_PASSWORD: kc
      POSTGRES_DB: knowledge_core
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kc -d knowledge_core"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kc

  # Local OIDC IdP (passkeys). First visit: http://pocket-id.localhost:1411/setup
  # Create a public PKCE client id "knowledge-core" with redirect:
  #   http://localhost:8080/ui/callback
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.13.0
    environment:
      # *.localhost resolves to 127.0.0.1 in browsers; compose alias reaches the container.
      APP_URL: http://pocket-id.localhost:1411
      TRUST_PROXY: "false"
      # Local-only fixed key (do not reuse in production).
      ENCRYPTION_KEY: bG9jYWwtZGV2LWtub3dsZWRnZS1jb3JlLWVuY3J5cHRpb24ta2V5IQ==
      PUID: "1000"
      PGID: "1000"
    ports:
      - "1411:1411"
    volumes:
      - pocketid-data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      kc:
        aliases:
          - pocket-id.localhost

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      KC_HTTP_ADDR: ":8080"
      KC_DATABASE_URL: postgres://kc:kc@postgres:5432/knowledge_core?sslmode=disable
      KC_LOG_LEVEL: info
      KC_AUTH_MODE: oidc
      KC_OIDC_ISSUER: http://pocket-id.localhost:1411
      KC_OIDC_AUDIENCE: knowledge-core
      # Bootstrap fallback (set KC_AUTH_MODE=bootstrap). Image ships writable /data for nonroot.
      KC_BOOTSTRAP_PASSWORD_FILE: /data/admin.password
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - pocket-id
    networks:
      - kc

volumes:
  pgdata:
  pocketid-data:

networks:
  kc:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.90.0/24
          gateway: 172.25.90.1
