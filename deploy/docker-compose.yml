# Project name avoids "deploy_default" when run from this directory.
# Explicit subnet: default Podman pools (10.89+) collide with hosts that
# advertise a 10.0.0.0/8 route (common on corporate Wi‑Fi / VPN).
name: knowledge-core

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: kc
      POSTGRES_PASSWORD: kc
      POSTGRES_DB: knowledge_core
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kc -d knowledge_core"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kc

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      KC_HTTP_ADDR: ":8080"
      KC_DATABASE_URL: postgres://kc:kc@postgres:5432/knowledge_core?sslmode=disable
      KC_LOG_LEVEL: info
      KC_AUTH_MODE: bootstrap
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - kc

volumes:
  pgdata:

networks:
  kc:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.90.0/24
          gateway: 172.25.90.1
