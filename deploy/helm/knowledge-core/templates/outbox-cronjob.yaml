{{- if .Values.outboxWorker.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "knowledge-core.fullname" . }}-outbox
  labels:
    {{- include "knowledge-core.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.outboxWorker.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "knowledge-core.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: outbox-worker
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "knowledge-core.serviceAccountName" . }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: outbox
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              args:
                - outbox
                - process
                - --limit
                - {{ .Values.outboxWorker.limit | quote }}
                - --migrations
                - /migrations
              env:
                - name: KC_LOG_LEVEL
                  value: info
                - name: KC_AUTH_MODE
                  value: {{ include "knowledge-core.authMode" . | quote }}
                - name: KC_BOOTSTRAP_ADMIN_SUBJECT
                  value: {{ .Values.auth.bootstrapAdminSubject | quote }}
                {{- if .Values.postgresql.enabled }}
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-postgresql
                      key: password
                - name: KC_DATABASE_URL
                  value: postgres://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable
                {{- else if .Values.externalDatabase.url }}
                - name: KC_DATABASE_URL
                  value: {{ .Values.externalDatabase.url | quote }}
                {{- end }}
              resources:
                {{- toYaml .Values.outboxWorker.resources | nindent 16 }}
{{- end }}
