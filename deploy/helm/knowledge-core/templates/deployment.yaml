apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knowledge-core.fullname" . }}
  labels:
    {{- include "knowledge-core.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "knowledge-core.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "knowledge-core.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "knowledge-core.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Release.Name }}-postgresql -p 5432 -U {{ .Values.postgresql.auth.username }}; do
                echo waiting for postgres...
                sleep 2
              done
      {{- end }}
      containers:
        - name: knowledge-core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KC_HTTP_ADDR
              value: ":8080"
            - name: KC_LOG_LEVEL
              value: info
            - name: KC_AUTH_MODE
              value: {{ include "knowledge-core.authMode" . | quote }}
            - name: KC_BOOTSTRAP_ADMIN_SUBJECT
              value: {{ .Values.auth.bootstrapAdminSubject | quote }}
            - name: KC_BOOTSTRAP_PASSWORD_FILE
              value: {{ .Values.auth.bootstrapPasswordFile | quote }}
            {{- if .Values.pocketId.enabled }}
            - name: KC_OIDC_ISSUER
              value: {{ include "knowledge-core.oidcIssuer" . | quote }}
            - name: KC_OIDC_AUDIENCE
              value: {{ .Values.auth.oidcAudience | quote }}
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
            - name: KC_DATABASE_URL
              value: postgres://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable
            {{- else if .Values.externalDatabase.url }}
            - name: KC_DATABASE_URL
              value: {{ .Values.externalDatabase.url | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "knowledge-core.fullname" .)) .Values.persistence.existingClaim }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
