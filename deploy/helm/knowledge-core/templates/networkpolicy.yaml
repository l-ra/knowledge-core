{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "knowledge-core.fullname" . }}
  labels:
    {{- include "knowledge-core.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "knowledge-core.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL (bundled)
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    # Pocket ID (OIDC discovery)
    {{- if .Values.pocketId.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pocket-id
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.pocketId.service.port }}
    {{- end }}
    # External HTTPS (OIDC issuer discovery when issuer is external)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
{{- end }}
