# Default values for knowledge-core.

replicaCount: 1

image:
  repository: ghcr.io/l-ra/knowledge-core
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: knowledge-core.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: null

networkPolicy:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data

auth:
  # dev | bootstrap | oidc — bootstrap is default for Helm (password in logs / PVC)
  mode: bootstrap
  bootstrapAdminSubject: admin
  bootstrapPasswordFile: /data/admin.password

  # Used when pocketId.enabled=true (overrides mode to oidc unless auth.mode is set explicitly)
  oidcAudience: knowledge-core

postgresql:
  enabled: true
  auth:
    username: kc
    database: knowledge_core
    # empty = chart generates a random password on first install
    password: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""

pocketId:
  enabled: false
  image:
    repository: ghcr.io/pocket-id/pocket-id
    tag: v2.13.0
  service:
    port: 1411
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  # Public URL users reach Pocket ID at (required when enabled)
  appUrl: ""
  # empty = chart generates random encryption key
  encryptionKey: ""
  trustProxy: "true"
  # Optional admin API key — when set, Helm post-install Job registers OIDC client
  adminApiKey: ""
  oidcClient:
    name: Knowledge Core
    callbackURLs:
      - http://localhost:8080/ui/callback
      - http://localhost:8080/callback

pgAdmin:
  enabled: false
  image:
    repository: docker.io/dpage/pgadmin4
    tag: "9.16"
  service:
    type: ClusterIP
    port: 80
  auth:
    email: admin@example.com
    password: ""
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  postgres:
    host: ""
    port: 5432
    username: kc
    database: knowledge_core
    password: ""
  config:
    masterPasswordRequired: false

outboxWorker:
  enabled: true
  schedule: "*/1 * * * *"
  limit: 100
  resources: {}

extraEnv: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
